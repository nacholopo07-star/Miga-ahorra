<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar acceso — MIGA Ahorra</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#edf4ef;color:#183e30;margin:0;min-height:100vh;display:grid;place-items:center}main{background:white;max-width:470px;width:calc(100% - 55px);padding:32px;border-radius:20px;box-shadow:0 12px 38px #183b2c20}h1{font-size:25px}form{display:grid;gap:14px}input,button{font:inherit;padding:13px;border-radius:10px}input{border:1px solid #c9d7cc}button{color:white;background:#176b51;border:0;cursor:pointer}a{color:#176b51}p{color:#53675b}</style></head><body><main><a href="/">← Volver a MIGA</a><h1>Recuperar contraseña</h1><form id="request"><label>Correo de tu cuenta<input type="email" id="email" required autocomplete="email"></label><button>Enviar enlace de recuperación</button></form><form id="change" hidden><label>Nueva contraseña (mínimo 12 caracteres)<input type="password" id="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><button>Cambiar contraseña</button></form><p id="status" role="status"></p></main><script src="/recuperar.js"></script></body></html>
